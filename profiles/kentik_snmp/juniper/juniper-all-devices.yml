# http://oid-info.com/get/1.3.6.1.4.1.2636.3.1.13.1
---
extends:
  - system-mib.yml
  - if-mib.yml
  - bgp4-mib.yml
  - ospf-mib.yml
  - host-resources-mib.yml

# The comment on this wildcard is the kentik.model fallback for any Juniper
# sysObjectID that no family profile lists (profiles that extend this file
# inherit it via GetDeviceSysComment's walk up the OID tree).
sysobjectid:
  - 1.3.6.1.4.1.2636.1.1.1.*                  # Junos Device

metrics:
  - MIB: JUNIPER-MIB
    table:
      OID: 1.3.6.1.4.1.2636.3.1.13.1
      name: jnxOperatingEntry
    symbols:
      - OID: 1.3.6.1.4.1.2636.3.1.13.1.8
        name: jnxOperatingCPU
        poll_time_sec: 60
        tag: CPU
      - OID: 1.3.6.1.4.1.2636.3.1.13.1.11
        name: jnxOperatingBuffer
        poll_time_sec: 60
        tag: MemoryUtilization
      # Celsius; 0 means unavailable or inapplicable.
      - OID: 1.3.6.1.4.1.2636.3.1.13.1.7
        name: jnxOperatingTemp
        tag: Temperature
      - OID: 1.3.6.1.4.1.2636.3.1.13.1.6
        name: jnxOperatingState
        enum:
          unknown: 1
          running: 2
          ready: 3
          reset: 4
          runningAtFullSpeed: 5
          down: 6
          standby: 7
    metric_tags:
      - tag: chassis
        column:
          OID: 1.3.6.1.4.1.2636.3.1.13.1.18
          name: jnxOperatingChassisDescr
      - column:
          OID: 1.3.6.1.4.1.2636.3.1.13.1.5
          name: jnxOperatingDescr

  - MIB: JUNIPER-MIB
    table:
      OID: 1.3.6.1.4.1.2636.3.1.15
      name: jnxFruTable
    symbols:
      - OID: 1.3.6.1.4.1.2636.3.1.15.1.8
        name: jnxFruState
        enum:
          unknown: 1
          empty: 2
          present: 3
          ready: 4
          announceOnline: 5
          online: 6
          anounceOffline: 7
          offline: 8
          diagnostic: 9
          standby: 10
      - OID: 1.3.6.1.4.1.2636.3.1.15.1.9
        name: jnxFruTemp
    metric_tags:
      - column:
          OID: 	1.3.6.1.4.1.2636.3.1.15.1.5
          name: jnxFruName
      - column:
          OID: 	1.3.6.1.4.1.2636.3.1.15.1.6
          name: jnxFruType
          enum:
            other: 1
            clockGenerator: 2
            flexiblePicConcentrator: 3
            switchingAndForwardingModule: 4
            controlBoard: 5
            routingEngine: 6
            powerEntryModule: 7
            frontPanelModule: 8
            switchInterfaceBoard: 9
            processorMezzanineBoardForSIB: 10
            portInterfaceCard: 11
            craftInterfacePanel: 12
            fan: 13
            lineCardChassis: 14
            forwardingEngineBoard: 15
      - column:
          OID: 	1.3.6.1.4.1.2636.3.1.15.1.15
          name: jnxFruChassisDescr

  - MIB: JUNIPER-ALARM-MIB
    symbols:
      - OID: 1.3.6.1.4.1.2636.3.4.2.2.1.0
        name: jnxYellowAlarmState
        enum:
          other: 1
          off: 2
          on: 3
      - OID: 1.3.6.1.4.1.2636.3.4.2.2.2.0
        name: jnxYellowAlarmCount
      - OID: 1.3.6.1.4.1.2636.3.4.2.2.3.0
        name: jnxYellowAlarmLastChange
      - OID: 1.3.6.1.4.1.2636.3.4.2.3.1.0
        name: jnxRedAlarmState
        enum:
          other: 1
          off: 2
          on: 3
      - OID: 1.3.6.1.4.1.2636.3.4.2.3.2.0
        name: jnxRedAlarmCount
      - OID: 1.3.6.1.4.1.2636.3.4.2.3.3.0
        name: jnxRedAlarmLastChange

  # RPM (JUNIPER-PING-MIB). Delays are microseconds.
  # One-way egress/ingress columns stay 0 unless the probe is
  # jnxPingIcmpTimeStamp (1.3.6.1.4.1.2636.3.7.2.1),
  # jnxPingUdpTimestamp (1.3.6.1.4.1.2636.3.7.2.6), or one-way
  # hardware timestamping is enabled.
  # jnxPingResultsTable is the test still in progress. Loss is
  # pingResultsSentProbes vs pingResultsProbeResponses (DISMAN-PING-MIB),
  # same owner/test index. Per-probe history tables are not walked.
  - MIB: JUNIPER-PING-MIB
    table:
      OID: 1.3.6.1.4.1.2636.3.7.1.3
      name: jnxPingResultsTable
    symbols:
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.1
        name: jnxPingResultsRttUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.3
        name: jnxPingResultsMinRttUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.4
        name: jnxPingResultsMaxRttUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.5
        name: jnxPingResultsAvgRttUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.6
        name: jnxPingResultsStdDevRttUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.17
        name: jnxPingResultsJitterRttUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.7
        name: jnxPingResultsEgressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.8
        name: jnxPingResultsMinEgressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.9
        name: jnxPingResultsMaxEgressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.10
        name: jnxPingResultsAvgEgressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.11
        name: jnxPingResultsStddevEgressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.18
        name: jnxPingResultsJitterEgressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.12
        name: jnxPingResultsIngressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.13
        name: jnxPingResultsMinIngressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.14
        name: jnxPingResultsMaxIngressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.15
        name: jnxPingResultsAvgIngressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.16
        name: jnxPingResultsStddevIngressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.19
        name: jnxPingResultsJitterIngressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.3.1.20
        name: jnxPingResultsStatus
        poll_time_sec: 60
        enum:
          responseReceived: 1
          unknown: 2
          internalError: 3
          requestTimedOut: 4
          unknownDestinationAddress: 5
          noRouteToTarget: 6
          interfaceInactiveToTarget: 7
          arpFailure: 8
          maxConcurrentLimitReached: 9
          unableToResolveDnsName: 10
          invalidHostAddress: 11
      - OID: 1.3.6.1.2.1.80.1.3.1.7
        name: pingResultsProbeResponses
        poll_time_sec: 60
      - OID: 1.3.6.1.2.1.80.1.3.1.8
        name: pingResultsSentProbes
        poll_time_sec: 60
    metric_tags:
      - tag: rpm_owner
        column:
          OID: 1.3.6.1.4.1.2636.3.7.1.3.1.22
          name: jnxPingResultsOwnerIndex
      - tag: rpm_test
        column:
          OID: 1.3.6.1.4.1.2636.3.7.1.3.1.23
          name: jnxPingResultsTestName
      - tag: rpm_descr
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.17
          name: pingCtlDescr
      - tag: rpm_probe_type
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.16
          name: pingCtlType
      - tag: rpm_target_type
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.3
          name: pingCtlTargetAddressType
          enum:
            unknown: 0
            ipv4: 1
            ipv6: 2
            ipv4z: 3
            ipv6z: 4
            dns: 16
      - tag: rpm_target
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.4
          name: pingCtlTargetAddress
          conversion: hextoip
      - tag: rpm_source_type
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.18
          name: pingCtlSourceAddressType
          enum:
            unknown: 0
            ipv4: 1
            ipv6: 2
            ipv4z: 3
            ipv6z: 4
            dns: 16
      - tag: rpm_source
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.19
          name: pingCtlSourceAddress
          conversion: hextoip
      - tag: rpm_interface
        column:
          OID: 1.3.6.1.4.1.2636.3.7.1.2.1.3
          name: jnxPingCtlIfName
      - tag: rpm_routing_instance
        column:
          OID: 1.3.6.1.4.1.2636.3.7.1.2.1.6
          name: jnxPingCtlRoutingInstanceName
      - tag: rpm_target_port
        column:
          OID: 1.3.6.1.4.1.2636.3.7.1.2.1.17
          name: jnxPingCtlTargetPort

  # Most recently completed RPM test. Same index as jnxPingResultsTable.
  # Row appears after the first test finishes.
  - MIB: JUNIPER-PING-MIB
    table:
      OID: 1.3.6.1.4.1.2636.3.7.1.5
      name: jnxPingLastTestResultTable
    symbols:
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.1
        name: jnxPingLastTestResultProbeResponses
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.2
        name: jnxPingLastTestResultSentProbes
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.4
        name: jnxPingLastTestResultMinRttUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.5
        name: jnxPingLastTestResultMaxRttUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.6
        name: jnxPingLastTestResultAvgRttUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.7
        name: jnxPingLastTestResultStdDevRttUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.16
        name: jnxPingLastTestResultPeakToPeakJitterRttUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.8
        name: jnxPingLastTestResultMinEgressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.9
        name: jnxPingLastTestResultMaxEgressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.10
        name: jnxPingLastTestResultAvgEgressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.11
        name: jnxPingLastTestResultStddevEgressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.17
        name: jnxPingLastTestResultPeakToPeakJitterEgressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.12
        name: jnxPingLastTestResultMinIngressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.13
        name: jnxPingLastTestResultMaxIngressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.14
        name: jnxPingLastTestResultAvgIngressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.15
        name: jnxPingLastTestResultStddevIngressUs
        poll_time_sec: 60
      - OID: 1.3.6.1.4.1.2636.3.7.1.5.1.18
        name: jnxPingLastTestResultPeakToPeakJitterIngressUs
        poll_time_sec: 60
    metric_tags:
      - tag: rpm_owner
        column:
          OID: 1.3.6.1.4.1.2636.3.7.1.3.1.22
          name: jnxPingResultsOwnerIndex
      - tag: rpm_test
        column:
          OID: 1.3.6.1.4.1.2636.3.7.1.3.1.23
          name: jnxPingResultsTestName
      - tag: rpm_descr
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.17
          name: pingCtlDescr
      - tag: rpm_probe_type
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.16
          name: pingCtlType
      - tag: rpm_target_type
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.3
          name: pingCtlTargetAddressType
          enum:
            unknown: 0
            ipv4: 1
            ipv6: 2
            ipv4z: 3
            ipv6z: 4
            dns: 16
      - tag: rpm_target
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.4
          name: pingCtlTargetAddress
          conversion: hextoip
      - tag: rpm_source_type
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.18
          name: pingCtlSourceAddressType
          enum:
            unknown: 0
            ipv4: 1
            ipv6: 2
            ipv4z: 3
            ipv6z: 4
            dns: 16
      - tag: rpm_source
        column:
          OID: 1.3.6.1.2.1.80.1.2.1.19
          name: pingCtlSourceAddress
          conversion: hextoip
      - tag: rpm_interface
        column:
          OID: 1.3.6.1.4.1.2636.3.7.1.2.1.3
          name: jnxPingCtlIfName
      - tag: rpm_routing_instance
        column:
          OID: 1.3.6.1.4.1.2636.3.7.1.2.1.6
          name: jnxPingCtlRoutingInstanceName
      - tag: rpm_target_port
        column:
          OID: 1.3.6.1.4.1.2636.3.7.1.2.1.17
          name: jnxPingCtlTargetPort
